name: Bug report
description: Something in elevate doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ELEVATE_DEMO=1 pnpm dev`
        2. Open ...
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - Demo mode
        - pnpm dev with my tokens
        - Docker Compose
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any tokens before pasting.
      render: text
