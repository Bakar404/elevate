name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      proof:
        description: "Also re-run the Verus proof pipeline (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Supply chain: every action is pinned to a commit SHA; the Verus installer rejects a tampered archive.
      - run: node scripts/ci/check-pinned-actions.mjs && node --test "scripts/ci/*.test.mjs"
      - run: bash scripts/ci/test-install-verus.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit + integration, including the differential test against proof/build/elevate_policy.wasm.
      - run: pnpm test
      # Gate quality on the eval set (reference reviews; `--live` needs model credentials).
      - run: pnpm eval:gates
      - run: pnpm build
      - run: pnpm --filter @elevate/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: apps/web/test-results
          retention-days: 7

  # Manual: the Linux Verus toolchain setup below has not been exercised yet.
  proof:
    if: github.event_name == 'workflow_dispatch' && inputs.proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Verus (pinned and checksummed in scripts/ci/verus.lock)
        run: |
          VERUS_HOME=$(VERUS_DIR="$RUNNER_TEMP/verus" bash scripts/ci/install-verus.sh)
          echo "$VERUS_HOME" >> "$GITHUB_PATH"
          echo "VERUS=$VERUS_HOME/verus" >> "$GITHUB_ENV"
          TOOLCHAIN=$(grep -oP '(?<=channel = ")[^"]+' proof/verified/rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Check Verus version
        run: |
          . scripts/ci/verus.lock
          VERSION=$(verus --version)
          echo "$VERSION"
          grep -qF "Version: $VERUS_VERSION" <<< "$VERSION"
      - run: pnpm proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt
          path: |
            proof/RECEIPT.md
            proof/results
