<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Proof-driven development: intent, Verus spec and proof, mutation check, differential test, receipt">
<title>Proof-driven development: intent, Verus spec and proof, mutation check, differential test, receipt</title>
<style>
  .flow { stroke-dasharray: 4 6; animation: march 1.4s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(.23,1,.32,1) infinite; }
  @keyframes march { to { stroke-dashoffset: -20; } }
  @keyframes ping { from { transform: scale(1); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .ping { animation: none; } }
</style>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.07)"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5b93d9" stop-opacity="0.14"/><stop offset="1" stop-color="#5b93d9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="210" rx="18" fill="#0d1015"/>
<rect width="1200" height="210" rx="18" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="1199" height="209" rx="17.5" fill="none" stroke="rgba(255,255,255,0.08)"/>
<text x="32" y="40" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#767e8a">PROOF-DRIVEN: EVERY RULE BETWEEN A HEADLINE AND YOUR REPO</text>
<g>
  <rect x="32" y="80" width="196" height="64" rx="12" fill="#14181e" stroke="rgba(255,255,255,0.15)" stroke-opacity="1"/>
  
  <text x="46" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.08em" fill="#767e8a">INTENT</text>
  <text x="46" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eef1f5">30 requirements</text>
  <text x="46" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a6aeb9">plain words</text>
</g>
<path d="M 228 112 L 256 112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-opacity="1" stroke-width="1.5" class="flow" stroke-linecap="round"/>
<polyline points="250,108 256,112 250,116" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="262" y="80" width="196" height="64" rx="12" fill="#14181e" stroke="#5b93d9" stroke-opacity="0.75"/>
  <rect x="274" y="94" width="6" height="6" rx="1.5" transform="rotate(45 277 97)" fill="#5b93d9"/>
  <text x="288" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.08em" fill="#767e8a">SPEC + PROOF</text>
  <text x="276" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eef1f5">Verus</text>
  <text x="276" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a6aeb9">for every input</text>
</g>
<path d="M 458 112 L 486 112" fill="none" stroke="#5b93d9" stroke-opacity="1" stroke-width="1.5" class="flow" stroke-linecap="round"/>
<polyline points="480,108 486,112 480,116" fill="none" stroke="#5b93d9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="492" y="80" width="196" height="64" rx="12" fill="#14181e" stroke="#e0605a" stroke-opacity="0.75"/>
  <rect x="504" y="94" width="6" height="6" rx="1.5" transform="rotate(45 507 97)" fill="#e0605a"/>
  <text x="518" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.08em" fill="#767e8a">MUTATION</text>
  <text x="506" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eef1f5">1 bug per clause</text>
  <text x="506" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a6aeb9">Verus must reject</text>
</g>
<path d="M 688 112 L 716 112" fill="none" stroke="#e0605a" stroke-opacity="1" stroke-width="1.5" class="flow" stroke-linecap="round"/>
<polyline points="710,108 716,112 710,116" fill="none" stroke="#e0605a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="722" y="80" width="196" height="64" rx="12" fill="#14181e" stroke="#8fa955" stroke-opacity="0.75"/>
  <rect x="734" y="94" width="6" height="6" rx="1.5" transform="rotate(45 737 97)" fill="#8fa955"/>
  <text x="748" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.08em" fill="#767e8a">DIFFERENTIAL</text>
  <text x="736" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eef1f5">TS vs WASM</text>
  <text x="736" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a6aeb9">every input class</text>
</g>
<path d="M 918 112 L 946 112" fill="none" stroke="#8fa955" stroke-opacity="1" stroke-width="1.5" class="flow" stroke-linecap="round"/>
<polyline points="940,108 946,112 940,116" fill="none" stroke="#8fa955" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="952" y="80" width="196" height="64" rx="12" fill="#14181e" stroke="#e0c37c" stroke-opacity="0.75"/>
  <rect x="964" y="94" width="6" height="6" rx="1.5" transform="rotate(45 967 97)" fill="#e0c37c"/>
  <text x="978" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.08em" fill="#767e8a">RECEIPT</text>
  <text x="966" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eef1f5">RECEIPT.md</text>
  <text x="966" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a6aeb9">shown in Settings</text>
</g>
<text x="32" y="180" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#a6aeb9">A negative control (a planted bug built to WASM) proves the differential test can fail.</text>
</svg>
