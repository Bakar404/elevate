<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="elevate swarm: planner, implementers, tester, reviewer, publisher">
<title>elevate swarm: planner, implementers, tester, reviewer, publisher</title>
<style>
  .flow { stroke-dasharray: 4 6; animation: march 1.4s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(.23,1,.32,1) infinite; }
  @keyframes march { to { stroke-dashoffset: -20; } }
  @keyframes ping { from { transform: scale(1); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .ping { animation: none; } }
</style>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(22,32,48,0.08)"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f6cbf" stop-opacity="0.14"/><stop offset="1" stop-color="#2f6cbf" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="18" fill="#f7f9fb"/>
<rect width="1200" height="300" rx="18" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="rgba(22,32,48,0.10)"/>
