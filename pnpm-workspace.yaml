packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  koffi: true
  sharp: true
  '@github/copilot-sdk': true

minimumReleaseAgeExclude:
  - '@github/copilot-sdk-darwin-arm64@1.0.31'
  - '@github/copilot-sdk-darwin-x64@1.0.31'
  - '@github/copilot-sdk-linux-arm64@1.0.31'
  - '@github/copilot-sdk-linux-x64@1.0.31'
  - '@github/copilot-sdk-linuxmusl-x64@1.0.31'
  - '@github/copilot-sdk-win32-arm64@1.0.31'
  - '@github/copilot-sdk-win32-x64@1.0.31'
  - '@github/copilot-sdk@1.0.31'
